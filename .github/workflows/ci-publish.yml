name: CI and publish

on:
  push:
    branches: [main, dev] # dev runs the tests and builds and smoke-tests the image; only main pushes it
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the publish job (never run for pull requests)
# gets packages:write, and only dependabot-merge can write to the repo.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/masstarvt/discord-bot
  CHECKPOINT_DISABLE: '1' # no Prisma update/telemetry calls

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      shadow:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Used only by the live-Redis step. Not on 6379: redis.js falls back to
      # localhost:6379 when REDIS_URL is unset, and the other passes need Redis down.
      redis:
        image: redis:7
        ports: ['6390:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:ci@localhost:5433/postgres?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every JavaScript file
        run: find . -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Validate the Prisma schema
        run: npx prisma validate

      # Offline suite: no database, Redis, Discord or network. Most test files
      # use DATABASE_URL when TEST_DATABASE_URL is unset, so this step must
      # override the job's real URL with an unreachable one: a stray query then
      # fails fast instead of reaching the Postgres service container.
      - name: Run the offline test suite
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/test

      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      # Same suite again with the opt-in database tests enabled (test/db.test.js
      # runs every RAW_SQL statement against the migrated schema). One file at a
      # time: the database tests share one database. Redis stays down here:
      # several database cases assert the Redis-down behaviour.
      - name: Run the test suite against the migrated database
        run: node --test --test-concurrency=1 "test/*.test.js"
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      # The files with assertions that need a live Redis (they fail when
      # TEST_REDIS_URL is set but Redis is unreachable). Only these files: the
      # rest of the suite expects Redis down.
      - name: Run the Redis-backed tests against the database and a live Redis
        run: node --test --test-concurrency=1 test/dashboard-automations.test.js
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_REDIS_URL: redis://127.0.0.1:6390

      - name: Fail if schema.prisma changed without a migration
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

  # Dependabot's patch and minor updates merge themselves once the tests pass;
  # major updates still wait for a person. Only Dependabot's own PRs from this
  # repo qualify: a fork PR never matches (and gets a read-only token anyway),
  # and a commit pushed by anyone else on a Dependabot branch changes the actor.
  rust-test:
    name: Test the Rust bot
    runs-on: ubuntu-latest
    timeout-minutes: 90 # a cold debug build of the whole workspace takes most of this; the cache makes later runs short
    env:
      # Smaller and faster test builds, so the build output fits the runner's disk and the Actions cache.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Rust tests run the JS bot's own code (Prisma, the services) to prove both read each other's data.
      - name: Install the JavaScript dependencies
        run: |
          npm ci
          npx prisma generate
          npm ci --prefix rust/mockdb

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-test-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-test-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}-
            rust-test-${{ runner.os }}-

      # Not a service container: the tests open many connections at once, and a service cannot take server flags.
      - name: Start PostgreSQL 17
        run: >-
          docker run -d --name rust-test-db -p 127.0.0.1:5434:5432 -e POSTGRES_PASSWORD=ci postgres:17
          -c max_connections=400 -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c timezone=UTC

      # One crate at a time, each against a fresh copy of a database the JS toolchain migrated and seeded, plus the
      # Redis-protocol mock (rust/mockdb). A skipped database test would hide a failure, so both servers must be up.
      - name: Run every crate's tests against PostgreSQL and the Redis mock
        env:
          MOCKDB_PG_URL: postgresql://postgres:ci@127.0.0.1:5434
          CARGO_BUILD_JOBS: 4
        run: bash rust/run-all-tests.sh

      - name: Show the database log on failure
        if: failure()
        run: docker logs --tail 100 rust-test-db

  dependabot-merge:
    name: Merge a Dependabot patch or minor update
    needs: [test, rust-test]
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'MasstarVT/discord-bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      # update-type is the biggest change in the PR, so a group that carries one
      # major update is left alone. --match-head-commit merges only the commit
      # that was tested. A merge made with GITHUB_TOKEN starts no push run, so
      # the publish (and Watchtower's deploy) is started by dispatching main.
      - name: Merge the tested commit and publish main
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"
          gh workflow run ci-publish.yml --repo "$GITHUB_REPOSITORY" --ref main

  publish:
    name: Build, smoke-test and push image
    needs: [test, rust-test]
    # dev builds and smoke-tests the image too; the login and push steps are limited to main.
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60 # a cold release build of the Rust workspace takes most of this
    permissions:
      contents: read
      packages: write
    # Shared with rollback.yml so a rollback and a publish never move :latest at
    # the same time. Test jobs run in parallel, so publish jobs can still arrive
    # out of push order; the push step therefore only moves :latest for the
    # current head of main. GitHub keeps one pending job per group: a newer one
    # cancels the pending one (re-run a cancelled run if its sha- tag is needed).
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'ghcr-latest-discord-bot' || format('image-build-{0}', github.ref) }}
      cancel-in-progress: false
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build the image (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: discord-bot:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 'Smoke test: both binaries are in the image and the dashboard parks without configuration'
        run: |
          docker run --rm --entrypoint sh discord-bot:ci -c 'command -v bot dashboard curl'
          # No dashboard settings are passed: it parks, answering 200 on /healthz and 503 everywhere else.
          docker run -d --name dash --network host discord-bot:ci dashboard
          ok=
          for _ in $(seq 1 15); do
            if curl -fsS --max-time 4 -o /dev/null http://127.0.0.1:8080/healthz; then ok=1; break; fi
            sleep 2
          done
          [ "$(curl -sS --max-time 4 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)" = 503 ] || ok=
          docker logs dash
          docker rm -f dash >/dev/null
          test -n "$ok"

      - name: 'Smoke test: the bot applies the migrations, serves /healthz and parks without a token'
        run: |
          docker run -d --name smoke --network host -e DATABASE_URL -e HEALTH_PORT=18081 discord-bot:ci
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 4 -o /dev/null http://127.0.0.1:18081/healthz; then ok=1; break; fi
            sleep 2
          done
          # Parked for the missing token: /readyz answers 503 with the reason.
          code=$(curl -sS --max-time 4 -o readyz.json -w '%{http_code}' http://127.0.0.1:18081/readyz || true)
          echo "$code $(cat readyz.json 2>/dev/null)"
          [ "$code" = 503 ] || ok=
          [ "$(jq -r .reason readyz.json 2>/dev/null)" = parked:missing-env ] || ok=
          # The bot ran the migrations compiled into it before parking: every one in the repo is applied.
          want=$(find prisma/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)
          got=$(docker exec "${{ job.services.db.id }}" psql -U postgres -tAc 'SELECT count(*) FROM "_prisma_migrations" WHERE finished_at IS NOT NULL')
          echo "migrations applied: $got of $want"
          [ "$got" = "$want" ] || ok=
          docker logs smoke
          docker rm -f smoke >/dev/null
          test -n "$ok"

      - name: Push the tested image
        if: github.ref == 'refs/heads/main'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The immutable sha- tag is always pushed.
          for tag in $(printf '%s\n' "$TAGS" | grep -v ':latest$'); do
            docker tag discord-bot:ci "$tag"
            docker push "$tag"
          done

          latest=$(printf '%s\n' "$TAGS" | grep ':latest$' || true)
          if [ -z "$latest" ]; then exit 0; fi

          # Never move :latest back to an older commit: if the branch has moved
          # on since this run started, the newer commit's run moves :latest.
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${GITHUB_REF#refs/}" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::Not moving :latest: ${GITHUB_REF_NAME} is now at ${head:0:7}, not ${GITHUB_SHA:0:7}. Only the sha- tag was pushed."
            exit 0
          fi
          docker tag discord-bot:ci "$latest"
          docker push "$latest"
