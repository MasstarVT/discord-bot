name: CI and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the publish job (never run for pull requests)
# gets packages:write.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/masstarvt/discord-bot
  CHECKPOINT_DISABLE: '1' # no Prisma update/telemetry calls

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      shadow:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:ci@localhost:5433/postgres?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every JavaScript file
        run: find . -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Validate the Prisma schema
        run: npx prisma validate

      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      - name: Fail if schema.prisma changed without a migration
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

  publish:
    name: Build, smoke-test and push image
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Shared with rollback.yml so a rollback and a publish never move :latest at the same time.
    concurrency:
      group: ghcr-latest-discord-bot
      cancel-in-progress: false
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build the image (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: discord-bot:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 'Smoke test: migrations, canvas and Prisma inside the image'
        run: |
          docker run --rm --network host -e DATABASE_URL discord-bot:ci \
            node_modules/.bin/prisma migrate deploy
          docker run --rm -i --network host -e DATABASE_URL discord-bot:ci \
            node --input-type=commonjs - <<'EOF'
          const { createCanvas, GlobalFonts } = require('@napi-rs/canvas');
          if (!GlobalFonts.registerFromPath('assets/fonts/Nunito-Bold.ttf', 'Nunito')) {
            throw new Error('assets/fonts/Nunito-Bold.ttf is missing from the image');
          }
          createCanvas(64, 32).getContext('2d').fillText('ok', 0, 16);
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          prisma.$connect()
            .then(() => prisma.$queryRaw`SELECT count(*)::int AS applied FROM "_prisma_migrations"`)
            .then((rows) => { console.log('smoke ok:', JSON.stringify(rows)); return prisma.$disconnect(); })
            .catch((err) => { console.error(err); process.exit(1); });
          EOF

      - name: 'Smoke test: the bot boots, serves /healthz and parks without a token'
        run: |
          docker run -d --name smoke --network host -e DATABASE_URL -e HEALTH_PORT=18081 discord-bot:ci
          ok=
          for _ in $(seq 1 30); do
            if docker exec smoke node -e "fetch('http://127.0.0.1:18081/healthz').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"; then ok=1; break; fi
            sleep 2
          done
          docker exec smoke node -e "fetch('http://127.0.0.1:18081/readyz').then(async r=>{const b=await r.json();console.log(r.status,b);process.exit(r.status===503&&b.reason==='parked:missing-env'?0:1)},()=>process.exit(1))" || ok=
          docker logs smoke
          docker rm -f smoke >/dev/null
          test -n "$ok"

      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Push the immutable sha- tag first, then move :latest.
          for tag in $(printf '%s\n' "$TAGS" | grep -v ':latest$') $(printf '%s\n' "$TAGS" | grep ':latest$' || true); do
            docker tag discord-bot:ci "$tag"
            docker push "$tag"
          done
