name: CI and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the publish job (never run for pull requests)
# gets packages:write, and only dependabot-merge can write to the repo.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/masstarvt/discord-bot
  CHECKPOINT_DISABLE: '1' # no Prisma update/telemetry calls

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      shadow:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Used only by the live-Redis step. Not on 6379: redis.js falls back to
      # localhost:6379 when REDIS_URL is unset, and the other passes need Redis down.
      redis:
        image: redis:7
        ports: ['6390:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:ci@localhost:5433/postgres?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax-check every JavaScript file
        run: find . -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Validate the Prisma schema
        run: npx prisma validate

      # Offline suite: no database, Redis, Discord or network. The tests force
      # their own offline environment; the unreachable URL below is a second
      # guard so a stray query fails fast instead of reaching the service.
      - name: Run the offline test suite
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:1/test

      - name: Apply migrations to an empty database
        run: npx prisma migrate deploy

      # Same suite again with the opt-in database tests enabled (test/db.test.js
      # runs every RAW_SQL statement against the migrated schema). One file at a
      # time: the database tests share one database. Redis stays down here:
      # several database cases assert the Redis-down behaviour.
      - name: Run the test suite against the migrated database
        run: node --test --test-concurrency=1 "test/*.test.js"
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}

      # The files with assertions that need a live Redis (they fail when
      # TEST_REDIS_URL is set but Redis is unreachable). Only these files: the
      # rest of the suite expects Redis down.
      - name: Run the Redis-backed tests against the database and a live Redis
        run: node --test --test-concurrency=1 test/dashboard-automations.test.js
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          TEST_REDIS_URL: redis://127.0.0.1:6390

      - name: Fail if schema.prisma changed without a migration
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url "$SHADOW_DATABASE_URL"
          --exit-code

  # Dependabot's patch and minor updates merge themselves once the tests pass;
  # major updates still wait for a person. Only Dependabot's own PRs from this
  # repo qualify: a fork PR never matches (and gets a read-only token anyway),
  # and a commit pushed by anyone else on a Dependabot branch changes the actor.
  dependabot-merge:
    name: Merge a Dependabot patch or minor update
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'MasstarVT/discord-bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      # update-type is the biggest change in the PR, so a group that carries one
      # major update is left alone. --match-head-commit merges only the commit
      # that was tested. A merge made with GITHUB_TOKEN starts no push run, so
      # the publish (and Watchtower's deploy) is started by dispatching main.
      - name: Merge the tested commit and publish main
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr merge "$PR_URL" --merge --match-head-commit "$HEAD_SHA"
          gh workflow run ci-publish.yml --repo "$GITHUB_REPOSITORY" --ref main

  publish:
    name: Build, smoke-test and push image
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Shared with rollback.yml so a rollback and a publish never move :latest at
    # the same time. Test jobs run in parallel, so publish jobs can still arrive
    # out of push order; the push step therefore only moves :latest for the
    # current head of main. GitHub keeps one pending job per group: a newer one
    # cancels the pending one (re-run a cancelled run if its sha- tag is needed).
    concurrency:
      group: ghcr-latest-discord-bot
      cancel-in-progress: false
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres?schema=public
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 7
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build the image (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: discord-bot:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 'Smoke test: migrations, canvas and Prisma inside the image'
        run: |
          docker run --rm --network host -e DATABASE_URL discord-bot:ci \
            node_modules/.bin/prisma migrate deploy
          docker run --rm -i --network host -e DATABASE_URL discord-bot:ci \
            node --input-type=commonjs - <<'EOF'
          const { createCanvas, GlobalFonts } = require('@napi-rs/canvas');
          if (!GlobalFonts.registerFromPath('assets/fonts/Nunito-Bold.ttf', 'Nunito')) {
            throw new Error('assets/fonts/Nunito-Bold.ttf is missing from the image');
          }
          createCanvas(64, 32).getContext('2d').fillText('ok', 0, 16);
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          prisma.$connect()
            .then(() => prisma.$queryRaw`SELECT count(*)::int AS applied FROM "_prisma_migrations"`)
            .then((rows) => { console.log('smoke ok:', JSON.stringify(rows)); return prisma.$disconnect(); })
            .catch((err) => { console.error(err); process.exit(1); });
          EOF

      - name: 'Smoke test: the bot boots, serves /healthz and parks without a token'
        run: |
          docker run -d --name smoke --network host -e DATABASE_URL -e HEALTH_PORT=18081 discord-bot:ci
          ok=
          for _ in $(seq 1 30); do
            if docker exec smoke node -e "fetch('http://127.0.0.1:18081/healthz').then(r=>process.exit(r.status===200?0:1),()=>process.exit(1))"; then ok=1; break; fi
            sleep 2
          done
          docker exec smoke node -e "fetch('http://127.0.0.1:18081/readyz').then(async r=>{const b=await r.json();console.log(r.status,b);process.exit(r.status===503&&b.reason==='parked:missing-env'?0:1)},()=>process.exit(1))" || ok=
          docker logs smoke
          docker rm -f smoke >/dev/null
          test -n "$ok"

      - name: Push the tested image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The immutable sha- tag is always pushed.
          for tag in $(printf '%s\n' "$TAGS" | grep -v ':latest$'); do
            docker tag discord-bot:ci "$tag"
            docker push "$tag"
          done

          latest=$(printf '%s\n' "$TAGS" | grep ':latest$' || true)
          if [ -z "$latest" ]; then exit 0; fi

          # Never move :latest back to an older commit: if the branch has moved
          # on since this run started, the newer commit's run moves :latest.
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${GITHUB_REF#refs/}" --jq .object.sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::Not moving :latest: ${GITHUB_REF_NAME} is now at ${head:0:7}, not ${GITHUB_SHA:0:7}. Only the sha- tag was pushed."
            exit 0
          fi
          docker tag discord-bot:ci "$latest"
          docker push "$latest"
