[package]
name = "bot-cards"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
bot-config.workspace = true
bot-util.workspace = true
tokio.workspace = true
futures.workspace = true
serde_json.workspace = true
url.workspace = true
# 2D drawing, text shaping and image codecs (pure Rust; the deployed image has no system fonts or native libs).
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd", "png-format"] }
rustybuzz = "0.20.1"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
